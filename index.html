<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>DiaBeat - T1D Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Dynamische Sensor-Effekte */
    body.hypo-mode { box-shadow: inset 0 0 25px var(--red); animation: pulse-hypo 0.8s infinite alternate; }
    @keyframes pulse-hypo { from { opacity: 0.85; } to { opacity: 1; } }
    body.hyper-mode { filter: blur(2px); }

    /* Header */
    header { display: flex; justify-content: space-between; padding: 10px 14px; background: #090d16; font-size: 0.85rem; border-bottom: 1px solid #334155; }
    
    /* CGM Display & Canvas */
    .cgm-container { padding: 10px 14px; background: var(--card); }
    .cgm-stats { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .bg-value { font-size: 2.2rem; font-weight: 800; }
    .bg-unit { font-size: 0.85rem; color: #94a3b8; }
    .iob-pill { background: #334155; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
    canvas { width: 100%; height: 110px; background: #090d16; border-radius: 6px; }

    /* Timeline */
    .timeline-bar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px; background: #131d2e; font-size: 0.75rem; border-bottom: 1px solid #334155; white-space: nowrap; }
    .event-chip { background: #1e293b; padding: 4px 8px; border-radius: 4px; border-left: 3px solid var(--blue); }
    .event-chip.active { border-color: var(--yellow); font-weight: bold; }

    /* Event Area */
    .event-area { flex: 1; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; }
    .event-card { background: var(--card); border-radius: 8px; padding: 12px; border: 1px solid #3b82f6; }
    .event-card h3 { font-size: 1rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .event-card p { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 10px; }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
    .stepper button { width: 40px; height: 36px; border-radius: 6px; background: #334155; color: #fff; font-size: 1.1rem; border: none; }
    .stepper span { font-size: 1.2rem; font-weight: bold; min-width: 60px; text-align: center; }
    .btn-eat { width: 100%; padding: 10px; background: var(--green); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }

    /* Action Dock */
    .action-dock { background: #090d16; padding: 12px 14px 16px; border-top: 1px solid #334155; }
    .pen-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .pen-btn { width: 45px; height: 38px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #fff; font-weight: bold; }
    .pen-display { font-size: 1.4rem; font-weight: bold; color: var(--blue); min-width: 70px; text-align: center; }
    .btn-inject { width: 100%; padding: 12px; background: var(--blue); border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 1rem; margin-bottom: 10px; }
    
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-rescue { padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; color: #fff; cursor: pointer; }
    .btn-tz { background: #d97706; }
    .btn-juice { background: #ea580c; }
  </style>
</head>
<body>

  <header>
    <span id="time-display">07:00 Uhr</span>
    <span>Score: <b id="score-display">0</b></span>
    <span>TiTR: <b id="titr-display">100%</b></span>
  </header>

  <div class="cgm-container">
    <div class="cgm-stats">
      <div>
        <span class="bg-value" id="bg-value">110</span>
        <span class="bg-unit">mg/dl</span>
        <span id="trend-arrow">→</span>
      </div>
      <div class="iob-pill">IOB: <span id="iob-value">0.0</span> IE</div>
    </div>
    <canvas id="cgmChart" width="350" height="110"></canvas>
  </div>

  <div class="timeline-bar" id="timeline">
    <div class="event-chip" data-time="450">07:30 Frühstück</div>
    <div class="event-chip" data-time="600">10:00 Kuchen</div>
    <div class="event-chip" data-time="750">12:30 Mittagessen</div>
    <div class="event-chip" data-time="1110">18:30 Abendbrot</div>
  </div>

  <div class="event-area" id="event-area">
    <!-- Inline-Event wird dynamisch gerendert -->
  </div>

  <div class="action-dock">
    <div class="pen-controls">
      <button class="pen-btn" onclick="adjustBolus(-1)">-1</button>
      <button class="pen-btn" onclick="adjustBolus(-0.5)">-0.5</button>
      <span class="pen-display" id="pen-value">0.0 IE</span>
      <button class="pen-btn" onclick="adjustBolus(0.5)">+0.5</button>
      <button class="pen-btn" onclick="adjustBolus(1)">+1</button>
    </div>
    <button class="btn-inject" onclick="injectBolus()">💉 JETZT INJIZIEREN</button>
    
    <div class="quick-actions">
      <button class="btn-rescue btn-tz" onclick="rescueCarbs(6)">🍬 Traubenzucker (+6g)</button>
      <button class="btn-rescue btn-juice" onclick="rescueCarbs(15)">🧃 Saft (+15g)</button>
    </div>
  </div>

  <script>
    // --- Spielstatus & Parameter ---
    let state = {
      gameTimeMinutes: 420, // Start 07:00
      bg: 110,
      score: 0,
      inRangeSeconds: 0,
      totalSeconds: 0,
      penDose: 0.0,
      activeEvents: [],
      bgHistory: Array(50).fill(110)
    };

    // Aktive Simulationselemente
    let activeInsulin = []; // { remainingSeconds, totalEffect, appliedEffect }
    let activeCarbs = [];   // { delaySeconds, remainingSeconds, carbAmount }

    const SCHEDULED_EVENTS = [
      { time: 450, icon: '🍞', title: 'Frühstück', desc: '1 Scheibe Vollkornbrot mit Gouda & 1 kleiner Apfel', trueCarbs: 35 },
      { time: 600, icon: '🍩', title: 'Kuchenrunde', desc: 'Ein Kollege gibt Mini-Donuts aus', trueCarbs: 20 },
      { time: 750, icon: '🍝', title: 'Kantine', desc: 'Ein tiefer Teller Pasta mit Tomatensauce', trueCarbs: 70 },
      { time: 1110, icon: '🥗', title: 'Abendessen', desc: 'Großer Salat mit Putenstreifen & 1 Scheibe Baguette', trueCarbs: 25 }
    ];

    let currentEventGuess = 30;

    // --- Core Game Loop (1 Sekunde Realzeit = 4,8 In-Game-Minuten) ---
    setInterval(() => {
      state.totalSeconds++;
      state.gameTimeMinutes += 4.8;
      
      // Berechne Insulin & KH-Absorption
      processMetabolism();

      // Blutzucker-Grenzwerte prüfen & Sensorik
      handleSensoryFeedback();

      // UI-Updates
      updateUI();
      drawChart();
      checkScheduledEvents();

      // Levelende nach 24 In-Game-Stunden (1440 min)
      if (state.gameTimeMinutes >= 1440) {
        alert(`Tag beendet! TiTR: ${Math.round((state.inRangeSeconds / state.totalSeconds) * 100)}% | Score: ${Math.round(state.score)}`);
        location.reload();
      }
    }, 1000);

    function processMetabolism() {
      let deltaBG = 0;

      // 1g KH hebt BZ um ca. 4 mg/dl (gestreckt über 15 Sek ~ 70 Spielminuten)
      activeCarbs.forEach((c, idx) => {
        if (c.delaySeconds > 0) {
          c.delaySeconds--;
        } else if (c.remainingSeconds > 0) {
          let step = (c.carbAmount * 4) / 15;
          deltaBG += step;
          c.remainingSeconds--;
        }
      });
      activeCarbs = activeCarbs.filter(c => c.remainingSeconds > 0);

      // 1 IE Insulin senkt BZ um ca. 40 mg/dl (gestreckt über 30 Sek ~ 140 Spielminuten)
      activeInsulin.forEach((ins) => {
        if (ins.remainingSeconds > 0) {
          let step = (ins.units * 40) / 30;
          deltaBG -= step;
          ins.remainingSeconds--;
        }
      });
      activeInsulin = activeInsulin.filter(i => i.remainingSeconds > 0);

      state.bg = Math.max(30, Math.round(state.bg + deltaBG));
      state.bgHistory.push(state.bg);
      state.bgHistory.shift();

      // Scoring
      if (state.bg >= 70 && state.bg <= 140) {
        state.score += 10;
        state.inRangeSeconds++;
      } else if (state.bg > 140 && state.bg <= 180) {
        state.score += 5;
        state.inRangeSeconds++;
      } else if (state.bg < 70) {
        state.score -= 20;
      }
    }

    function handleSensoryFeedback() {
      const body = document.body;
      if (state.bg <= 40) {
        if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
        alert("Bewusstlosigkeit (Hypo < 40 mg/dl)! Notarzt gerufen. Game Over.");
        location.reload();
      } else if (state.bg < 70) {
        body.classList.add('hypo-mode');
        body.classList.remove('hyper-mode');
        if (navigator.vibrate) navigator.vibrate(200);
      } else if (state.bg > 180) {
        body.classList.add('hyper-mode');
        body.classList.remove('hypo-mode');
      } else {
        body.classList.remove('hypo-mode', 'hyper-mode');
      }
    }

    // --- Spieler-Aktionen ---
    function adjustBolus(amount) {
      state.penDose = Math.max(0, Math.round((state.penDose + amount) * 10) / 10);
      document.getElementById('pen-value').innerText = `${state.penDose.toFixed(1)} IE`;
    }

    function injectBolus() {
      if (state.penDose <= 0) return;
      activeInsulin.push({ units: state.penDose, remainingSeconds: 30 });
      state.penDose = 0.0;
      document.getElementById('pen-value').innerText = "0.0 IE";
    }

    function rescueCarbs(grams) {
      // Hypo-Helfer wirken fast sofort (nach ca. 2 Sek)
      activeCarbs.push({ delaySeconds: 2, remainingSeconds: 6, carbAmount: grams });
    }

    function checkScheduledEvents() {
      SCHEDULED_EVENTS.forEach((ev) => {
        if (state.gameTimeMinutes >= ev.time && !ev.triggered) {
          ev.triggered = true;
          triggerMealEvent(ev);
        }
      });
    }

    function triggerMealEvent(ev) {
      currentEventGuess = 30;
      const area = document.getElementById('event-area');
      area.innerHTML = `
        <div class="event-card">
          <h3>${ev.icon} ${ev.title}</h3>
          <p>${ev.desc}</p>
          <div class="stepper">
            <button onclick="adjustGuess(-5)">-5</button>
            <span id="guess-display">${currentEventGuess}g</span>
            <button onclick="adjustGuess(5)">+5</button>
          </div>
          <button class="btn-eat" onclick="submitMeal(${ev.trueCarbs})">Mahlzeit essen</button>
        </div>
      `;
    }

    function adjustGuess(amount) {
      currentEventGuess = Math.max(5, currentEventGuess + amount);
      document.getElementById('guess-display').innerText = `${currentEventGuess}g`;
    }

    function submitMeal(trueCarbs) {
      // Mahlzeit wird verdaut (leicht verzögerter Wirkeintritt)
      activeCarbs.push({ delaySeconds: 4, remainingSeconds: 15, carbAmount: trueCarbs });
      
      const area = document.getElementById('event-area');
      area.innerHTML = `<div style="text-align:center; font-size:0.8rem; color:#94a3b8;">
        Tatsächlich: <b>${trueCarbs}g KH</b> (Geschätzt: ${currentEventGuess}g).
      </div>`;
      setTimeout(() => { area.innerHTML = ''; }, 3500);
    }

    // --- Rendering Helpers ---
    function updateUI() {
      // Uhrzeit
      let hours = Math.floor(state.gameTimeMinutes / 60) % 24;
      let mins = Math.floor(state.gameTimeMinutes % 60);
      document.getElementById('time-display').innerText = 
        `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')} Uhr`;

      // Status
      document.getElementById('bg-value').innerText = state.bg;
      document.getElementById('score-display').innerText = Math.max(0, Math.round(state.score));
      
      let titr = state.totalSeconds > 0 ? Math.round((state.inRangeSeconds / state.totalSeconds) * 100) : 100;
      document.getElementById('titr-display').innerText = `${titr}%`;

      // IOB
      let totalIOB = activeInsulin.reduce((acc, i) => acc + (i.units * (i.remainingSeconds / 30)), 0);
      document.getElementById('iob-value').innerText = totalIOB.toFixed(1);

      // Trendpfeil
      let diff = state.bgHistory[state.bgHistory.length - 1] - state.bgHistory[state.bgHistory.length - 4];
      let arrow = "→";
      if (diff > 8) arrow = "↑";
      else if (diff > 3) arrow = "↗";
      else if (diff < -8) arrow = "↓";
      else if (diff < -3) arrow = "↘";
      document.getElementById('trend-arrow').innerText = arrow;
    }

    function drawChart() {
      const canvas = document.getElementById('cgmChart');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Zielkorridor 70-140 hervorheben
      let y140 = canvas.height - ((140 - 40) / 260) * canvas.height;
      let y70 = canvas.height - ((70 - 40) / 260) * canvas.height;
      ctx.fillStyle = "rgba(16, 185, 129, 0.15)";
      ctx.fillRect(0, y140, canvas.width, y70 - y140);

      // Kurve zeichnen
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = state.bg < 70 ? "#ef4444" : (state.bg > 140 ? "#f59e0b" : "#10b981");

      state.bgHistory.forEach((val, idx) => {
        let x = (idx / (state.bgHistory.length - 1)) * canvas.width;
        let clamped = Math.max(40, Math.min(300, val));
        let y = canvas.height - ((clamped - 40) / 260) * canvas.height;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
